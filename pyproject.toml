[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xaloqi-tester"
version = "1.5.7"
description = "Xaloqi TestLab core — UDS ECU validation campaign runner with a built-in simulated ECU. Apache-2.0."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Xaloqi" }]
keywords = ["UDS", "ISO-14229", "ISO-TP", "ECU", "automotive", "diagnostics", "CAN", "simulator"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
]
# The free tier runs entirely against the in-process VirtualBus + simulator —
# no CAN stack needed. Real transports live in xaloqi-tester-pro.
dependencies = [
    "pyyaml>=6.0",
    "pycryptodome>=3.18",
]

[project.urls]
Homepage      = "https://xaloqi.com"
Documentation = "https://xaloqi.com/testlab/docs"
Repository    = "https://github.com/Xaloqi/xaloqi-testlab-core"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[project.scripts]
testlab-run = "xaloqi.runner:main"
testlab     = "xaloqi.testlab:main"
xaloqi-sim  = "xaloqi.sim:main"

[tool.setuptools.packages.find]
where   = ["."]
include = ["xaloqi*"]

# Bundled example config + campaign (O-11): so `xaloqi-sim --demo`'s own
# "Next:" instruction has a real file to point pip-installed users at,
# not just a repo-relative path that doesn't exist post-install.
#
# xaloqi.tester.conformance's corpus/*.json: without this, the wheel ships
# every .py file in that package but silently omits the vector data
# vectors.py's _CORPUS_DIR actually loads at runtime -- found by unzip -l
# on a real built wheel, not by trusting the build log, while preparing
# the v1.5.5 PyPI publish. load_suite() would raise FileNotFoundError for
# every PyPI install; core/tests exercises the package from a source
# checkout, so nothing there would have caught it either.
[tool.setuptools.package-data]
"xaloqi.examples" = ["*.yaml", "campaigns/*.yaml"]
"xaloqi.tester.conformance" = ["corpus/*.json", "README.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
