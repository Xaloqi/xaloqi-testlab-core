metadata:
  ecu_name: TestLab-Sim
  version: "1.0"
  description: >
    Minimal diagnostics config for the Xaloqi TestLab ECU simulator.
    Used by docker/ecu_sim/sim.py and the runner campaign.

can:
  interface: vcan0
  rx_can_id: "0x7DF"
  tx_can_id: "0x7E8"

timing:
  p2_server_max_ms: 25
  p2_star_server_max_ms: 5000

dids:
  - id: "0xF190"
    name: VIN
    data_length: 17
    access: [read]
    min_session: default
    read_security_level: 0
    write_security_level: 0

  - id: "0xF18C"
    name: ECUSerialNumber
    data_length: 11
    access: [read]
    min_session: default
    read_security_level: 0
    write_security_level: 0

  - id: "0xF187"
    name: VehicleManufacturerSparePartNumber
    data_length: 16
    access: [read]
    min_session: extended
    read_security_level: 1
    write_security_level: 1

  - id: "0x2001"
    name: CellVoltage_mV
    data_length: 2
    access: [read]
    min_session: default
    read_security_level: 0
    write_security_level: 0

dtcs:
  - code: "0xC00100"
    description: CAN communication loss
    severity: check_at_next_halt

  - code: "0xC00200"
    description: Voltage sensor out of range
    severity: immediate
