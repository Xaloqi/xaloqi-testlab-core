jobs:
  firmware_download:
    description: Exercise a complete UDS firmware download sequence.
    timeout_ms: 30000
    on_failure: abort

    steps:
      - action: session
        value: programming

      - action: security_access
        level: 1

      # One step runs the whole sequence: 0x34, every 0x36 block, 0x37. A
      # separate request_download before it, or request_transfer_exit after it,
      # is refused by an EDS ECU (0x22, 0x24), and now by the simulator.
      - action: transfer_data
        file: examples/firmware_download/firmware.bin
        memory_address: "0x00000000"

      - action: session
        value: default
